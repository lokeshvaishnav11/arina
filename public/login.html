        <style>
            :root {
                --bg: #07050b;
                --panel: #100b18;
                --panel2: #171021;
                --text: #fff;
                --muted: #b8aec2;
                --pink: #ff3f9f;
                --pink2: #ff74c6;
                --violet: #8b5cf6;
                --cyan: #42d9ff;
                --line: rgba(255,255,255,.11);
            }

            * {
                box-sizing: border-box
            }

            html,body {
                margin: 0;
                min-height: 100%
            }

            body {
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 22px;
                color: var(--text);
                font-family: Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
                background: radial-gradient(circle at 15% 0%,rgba(255,63,159,.22),transparent 30%), radial-gradient(circle at 90% 14%,rgba(139,92,246,.22),transparent 29%), radial-gradient(circle at 50% 100%,rgba(66,217,255,.08),transparent 35%), linear-gradient(180deg,#09060e 0%,#050407 100%);
                overflow-x: hidden;
            }

            body:before {
                content: "";
                position: fixed;
                inset: 0;
                pointer-events: none;
                opacity: .18;
                background-image: linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px), linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
                background-size: 42px 42px;
            }

            .shell {
                width: min(460px,100%);
                perspective: 1400px;
            }

            .card {
                position: relative;
                padding: 34px;
                border-radius: 32px;
                background: linear-gradient(145deg,rgba(30,19,42,.97),rgba(11,8,17,.985));
                border: 1px solid rgba(255,255,255,.14);
                box-shadow: 0 35px 90px rgba(0,0,0,.52), 0 0 55px rgba(178,54,196,.10), inset 0 1px 0 rgba(255,255,255,.08), inset 0 -18px 38px rgba(0,0,0,.24);
                transform-style: preserve-3d;
            }

            .card:before {
                content: "";
                position: absolute;
                inset: 1px;
                border-radius: 31px;
                pointer-events: none;
                background: linear-gradient(135deg,rgba(255,255,255,.08),transparent 28%,transparent 74%,rgba(255,63,159,.05));
            }

            .logo {
                text-align: center;
                font-size: 25px;
                font-weight: 950;
                letter-spacing: .4px;
                text-shadow: 0 0 28px rgba(255,63,159,.25);
            }

            .logo span {
                background: linear-gradient(90deg,var(--pink2),#c583ff);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }

            .logo small {
                display: block;
                margin-top: 4px;
                font-size: 8px;
                letter-spacing: 3px;
                color: #9e95a7;
            }

            .icon3d {
                width: 82px;
                height: 82px;
                margin: 28px auto 18px;
                display: grid;
                place-items: center;
                border-radius: 26px;
                font-size: 38px;
                background: linear-gradient(145deg,#ff6fbd,#ad49ea 55%,#6f53f3);
                border: 1px solid rgba(255,255,255,.24);
                box-shadow: 0 20px 35px rgba(181,52,191,.32), inset 7px 7px 12px rgba(255,255,255,.18), inset -9px -11px 18px rgba(63,14,96,.32);
                transform: translateZ(36px) rotateX(5deg);
            }

            .logoImage {
                width: 150px;
                height: 150px;
                padding: 0;
                overflow: hidden;
                border-radius: 34px;
                background: #120b19;
                box-shadow: 0 24px 45px rgba(214,57,178,.34), 0 0 38px rgba(255,63,159,.18), inset 0 1px 0 rgba(255,255,255,.18);
                transform: translateZ(42px) rotateX(3deg);
            }

            .logoImage img {
                width: 81%;
                height: 97%;
                display: block;
                object-fit: cover;
                border-radius: 34px;
            }

            h1 {
                margin: 0;
                text-align: center;
                font-size: 32px;
                letter-spacing: -1px;
            }

            .subtitle {
                margin: 10px 0 25px;
                text-align: center;
                color: var(--muted);
                font-size: 14px;
                line-height: 1.6;
            }

            label {
                display: block;
                font-size: 12px;
                font-weight: 850;
                margin: 14px 0 7px;
                color: #e9dfee;
            }

            .field {
                display: flex;
                align-items: center;
                border-radius: 17px;
                border: 1px solid rgba(255,255,255,.11);
                background: linear-gradient(180deg,#1d1427,#110d18);
                box-shadow: inset 0 2px 5px rgba(255,255,255,.025), 0 9px 20px rgba(0,0,0,.16);
                overflow: hidden;
                transition: .2s ease;
            }

            .field:focus-within {
                border-color: rgba(255,92,181,.62);
                box-shadow: 0 0 0 4px rgba(255,63,159,.08),0 12px 26px rgba(0,0,0,.2);
                transform: translateY(-1px);
            }

            .prefix {
                padding: 0 14px;
                min-height: 54px;
                display: flex;
                align-items: center;
                border-right: 1px solid rgba(255,255,255,.09);
                color: #fff;
                font-weight: 900;
                white-space: nowrap;
            }

            input {
                width: 100%;
                border: 0;
                outline: 0;
                color: #fff;
                background: transparent;
                padding: 17px 15px;
                font: inherit;
            }

            input::placeholder {
                color: #817689
            }

            .joinBtn {
                width: 100%;
                margin-top: 22px;
                padding: 16px 18px;
                border: 0;
                border-radius: 17px;
                color: #fff;
                font-size: 15px;
                font-weight: 950;
                letter-spacing: .25px;
                cursor: pointer;
                background: linear-gradient(135deg,var(--pink),#b747e9 54%,var(--violet));
                border: 1px solid rgba(255,255,255,.22);
                box-shadow: 0 16px 30px rgba(214,57,178,.32), inset 0 2px 1px rgba(255,255,255,.26), inset 0 -6px 13px rgba(84,27,131,.22);
                transition: .2s ease;
            }

            .joinBtn:hover {
                transform: translateY(-3px);
                box-shadow: 0 21px 38px rgba(214,57,178,.42),inset 0 2px 1px rgba(255,255,255,.28);
            }

            .note {
                margin-top: 16px;
                text-align: center;
                color: #8f8497;
                font-size: 11px;
                line-height: 1.5;
            }

            .error {
                display: none;
                margin-top: 12px;
                padding: 10px 12px;
                border-radius: 13px;
                color: #ffd1df;
                background: rgba(255,66,112,.10);
                border: 1px solid rgba(255,92,128,.20);
                font-size: 12px;
            }

            /* Age popup */
            .modal {
                display: none;
                position: fixed;
                inset: 0;
                z-index: 1000;
                align-items: center;
                justify-content: center;
                padding: 18px;
                background: rgba(0,0,0,.74);
                backdrop-filter: blur(18px);
            }

            .modal.show {
                display: flex
            }

            .ageBox {
                width: min(420px,100%);
                padding: 30px;
                text-align: center;
                border-radius: 30px;
                background: linear-gradient(145deg,#1b1126,#0c0911);
                border: 1px solid rgba(255,255,255,.16);
                box-shadow: 0 40px 100px rgba(0,0,0,.65), 0 0 60px rgba(214,57,178,.14), inset 0 1px 0 rgba(255,255,255,.08);
                animation: pop .22s ease;
                transform-style: preserve-3d;
            }

            @keyframes pop {
                from {
                    opacity: 0;
                    transform: scale(.9) rotateX(8deg)
                }

                to {
                    opacity: 1;
                    transform: none
                }
            }

            .ageIcon {
                width: 88px;
                height: 88px;
                margin: 0 auto 16px;
                display: grid;
                place-items: center;
                border-radius: 50%;
                font-size: 30px;
                font-weight: 950;
                background: linear-gradient(145deg,#ff60b4,#9947e9);
                border: 1px solid rgba(255,255,255,.22);
                box-shadow: 0 18px 35px rgba(192,54,192,.32), inset 7px 8px 12px rgba(255,255,255,.16), inset -8px -10px 16px rgba(61,12,103,.30);
            }

            .ageBox h2 {
                margin: 4px 0 8px;
                font-size: 27px
            }

            .ageBox p {
                margin: 0 0 22px;
                color: var(--muted);
                line-height: 1.55
            }

            .ageActions {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 11px;
            }

            .ageBtn {
                padding: 14px 12px;
                border-radius: 16px;
                border: 1px solid rgba(255,255,255,.12);
                color: #fff;
                font-weight: 900;
                cursor: pointer;
                box-shadow: inset 0 1px 0 rgba(255,255,255,.15),0 12px 25px rgba(0,0,0,.20);
            }

            .yes {
                background: linear-gradient(135deg,#ff3f9f,#8b5cf6);
            }

            .no {
                background: linear-gradient(180deg,#30243a,#21192a);
            }

            .ageBtn:hover {
                transform: translateY(-2px)
            }

            @media(max-width: 520px) {
                .card {
                    padding:26px 20px;
                    border-radius: 26px
                }

                h1 {
                    font-size: 28px
                }

                .ageActions {
                    grid-template-columns: 1fr
                }
            }

            /* Full-page 3D animated background */
            .bg3d {
                position: fixed;
                inset: 0;
                z-index: -2;
                overflow: hidden;
                pointer-events: none;
                perspective: 1200px;
            }

            .bg3d::before {
                content: "";
                position: absolute;
                inset: -18%;
                background: radial-gradient(circle at 20% 20%,rgba(255,63,159,.18),transparent 28%), radial-gradient(circle at 80% 30%,rgba(139,92,246,.20),transparent 30%), radial-gradient(circle at 50% 80%,rgba(66,217,255,.10),transparent 26%);
                filter: blur(12px);
                animation: bgFloat 10s ease-in-out infinite alternate;
            }

            .bgOrb {
                position: absolute;
                border-radius: 50%;
                transform-style: preserve-3d;
                box-shadow: inset 12px 14px 25px rgba(255,255,255,.12), inset -18px -22px 35px rgba(0,0,0,.28), 0 25px 65px rgba(0,0,0,.24);
                filter: saturate(120%);
                opacity: .75;
            }

            .bgOrb.o1 {
                width: 220px;
                height: 220px;
                left: -70px;
                top: 8%;
                background: radial-gradient(circle at 32% 26%,#ffb3dd 0 7%,#ff4fa7 24%,#8f48e6 58%,#1c1028 82%);
                animation: orbOne 8s ease-in-out infinite;
            }

            .bgOrb.o2 {
                width: 150px;
                height: 150px;
                right: 5%;
                top: 14%;
                background: radial-gradient(circle at 30% 25%,#d7c0ff 0 8%,#a66df4 28%,#5d37d7 58%,#171021 82%);
                animation: orbTwo 9.5s ease-in-out infinite;
            }

            .bgOrb.o3 {
                width: 180px;
                height: 180px;
                left: 8%;
                bottom: 7%;
                background: radial-gradient(circle at 28% 24%,#bff7ff 0 7%,#4ed8ff 28%,#6b50e6 58%,#151021 84%);
                animation: orbThree 11s ease-in-out infinite;
            }

            .bgOrb.o4 {
                width: 110px;
                height: 110px;
                right: 14%;
                bottom: 13%;
                background: radial-gradient(circle at 30% 25%,#ffd1ea 0 8%,#ff63b5 30%,#b348dc 60%,#1b1026 84%);
                animation: orbFour 7.5s ease-in-out infinite;
            }

            .ring3d {
                position: absolute;
                width: 360px;
                height: 360px;
                left: 50%;
                top: 50%;
                border-radius: 50%;
                border: 2px solid rgba(255,255,255,.08);
                box-shadow: 0 0 35px rgba(255,63,159,.08), inset 0 0 35px rgba(139,92,246,.08);
                transform: translate(-50%,-50%) rotateX(67deg) rotateZ(12deg);
                animation: ringSpin 16s linear infinite;
            }

            .ring3d.r2 {
                width: 520px;
                height: 520px;
                border-color: rgba(139,92,246,.06);
                animation-duration: 22s;
                animation-direction: reverse;
            }

            .particle {
                position: absolute;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: rgba(255,255,255,.8);
                box-shadow: 0 0 18px rgba(255,255,255,.8);
                animation: particleUp 8s linear infinite;
            }

            .p1 {
                left: 18%;
                bottom: -20px;
                animation-delay: -1s
            }

            .p2 {
                left: 42%;
                bottom: -30px;
                animation-delay: -4s
            }

            .p3 {
                left: 70%;
                bottom: -10px;
                animation-delay: -2.5s
            }

            .p4 {
                left: 87%;
                bottom: -25px;
                animation-delay: -6s
            }

            .p5 {
                left: 30%;
                bottom: -15px;
                animation-delay: -7s
            }

            @keyframes bgFloat {
                from {
                    transform: translate3d(-1%,-1%,0) scale(1)
                }

                to {
                    transform: translate3d(2%,1.5%,0) scale(1.06)
                }
            }

            @keyframes orbOne {
                0%,100% {
                    transform: translate3d(0,0,80px) rotateY(0deg)
                }

                50% {
                    transform: translate3d(70px,45px,150px) rotateY(24deg)
                }
            }

            @keyframes orbTwo {
                0%,100% {
                    transform: translate3d(0,0,120px)
                }

                50% {
                    transform: translate3d(-65px,55px,210px) rotateX(22deg)
                }
            }

            @keyframes orbThree {
                0%,100% {
                    transform: translate3d(0,0,100px)
                }

                50% {
                    transform: translate3d(85px,-45px,180px) rotateY(-25deg)
                }
            }

            @keyframes orbFour {
                0%,100% {
                    transform: translate3d(0,0,70px)
                }

                50% {
                    transform: translate3d(-55px,-65px,160px) rotateX(-20deg)
                }
            }

            @keyframes ringSpin {
                from {
                    transform: translate(-50%,-50%) rotateX(67deg) rotateZ(0deg)
                }

                to {
                    transform: translate(-50%,-50%) rotateX(67deg) rotateZ(360deg)
                }
            }

            @keyframes particleUp {
                0% {
                    transform: translateY(0) scale(.7);
                    opacity: 0
                }

                15% {
                    opacity: .85
                }

                75% {
                    opacity: .55
                }

                100% {
                    transform: translateY(-115vh) scale(1.4);
                    opacity: 0
                }
            }

            @media(max-width: 600px) {
                .bgOrb.o1 {
                    width:160px;
                    height: 160px
                }

                .bgOrb.o2 {
                    width: 110px;
                    height: 110px
                }

                .bgOrb.o3 {
                    width: 130px;
                    height: 130px
                }

                .bgOrb.o4 {
                    width: 90px;
                    height: 90px
                }

                .ring3d {
                    width: 280px;
                    height: 280px
                }

                .ring3d.r2 {
                    width: 410px;
                    height: 410px
                }
            }

            @media(prefers-reduced-motion:reduce) {
                .bg3d *,.bg3d::before {
                    animation: none !important
                }
            }
        </style>

                </div>
                <h1>Join Now</h1>
                <p class="subtitle">Enter your Pakistani mobile number and password to join the community.</p>
                <form id="joinForm">
                    <label>Mobile number</label>
                    <div class="field">
                        <div class="prefix">🇵🇰 +92</div>
                        <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="300 1234567">
                    </div>
                    <label>Password</label>
                    <div class="field">
                        <input id="password" type="password" autocomplete="current-password" minlength="4" placeholder="Enter your password">
                    </div>
                    <div id="error" class="error"></div>
                    <button class="joinBtn" type="submit">✨ JOIN NOW</button>
                </form>
                <div class="note">By continuing, your details will be saved in this browser for easier access next time.</div>
            </div>
        </div>
        <div id="ageModal" class="modal">
            <div class="ageBox">
                <div class="ageIcon">18+</div>
                <h2>Are you 18 years or older?</h2>
                <p>Select an option to continue.</p>
                <div class="ageActions">
                    <button class="ageBtn yes" onclick="finishJoin('yes')">✓ Yes, I am 18+</button>
                    <button class="ageBtn no" onclick="finishJoin('no')">No</button>
                </div>
            </div>
        </div>
        <script>
            const LOGIN_VALID_DAYS = 15;
            const SITE_URL = '/home';

            const joinForm = document.getElementById('joinForm');
            const phoneInput = document.getElementById('phone');
            const passwordInput = document.getElementById('password');
            const errorBox = document.getElementById('error');
            const ageModal = document.getElementById('ageModal');

            function cleanPhone(v) {
                return String(v || '').replace(/\D/g, '');
            }

            function getSavedUser() {
                try {
                    return JSON.parse(localStorage.getItem('arinaUser') || 'null');
                } catch (e) {
                    return null;
                }
            }

            function getLoginSession() {
                try {
                    return JSON.parse(localStorage.getItem('arinaLoginSession') || 'null');
                } catch (e) {
                    return null;
                }
            }

            function loginStillValid() {
                const session = getLoginSession();

                return !!(session && session.loggedIn === true && Number(session.expiresAt) > Date.now());
            }

            function showError(message) {
                errorBox.textContent = message;
                errorBox.style.display = 'block';
            }

            function hideError() {
                errorBox.textContent = '';
                errorBox.style.display = 'none';
            }

            // =======================================
            // VALID 15-DAY SESSION => DIRECT WEBSITE
            // =======================================

            function checkExistingLogin() {
                if (loginStillValid()) {
                    location.replace(SITE_URL);
                    return;
                }

                // Expired/broken session remove only.
                localStorage.removeItem('arinaLoginSession');
            }

            // =======================================
            // LOGIN / FIRST-TIME USER
            // =======================================

            function loginUser() {
                const p = cleanPhone(phoneInput.value);
                const pw = passwordInput.value.trim();

                hideError();

                if (p.length !== 10 || !p.startsWith('3')) {
                    showError('Enter a valid Pakistani mobile number.');
                    return;
                }

                if (pw.length < 4) {
                    showError('Password must be at least 4 characters.');
                    return;
                }

                let user = getSavedUser();

                // First visit: save entered credentials in this browser.
                if (!user) {
                    user = {
                        id: Date.now(),
                        phone: p,
                        password: pw,
                        createdAt: Date.now()
                    };

                    localStorage.setItem('arinaUser', JSON.stringify(user));
                } else {
                    // Returning user must enter the same saved credentials.
                    if (cleanPhone(user.phone) !== p || user.password !== pw) {
                        showError('Incorrect mobile number or password.');
                        return;
                    }
                }

                const expiresAt = Date.now() + LOGIN_VALID_DAYS * 24 * 60 * 60 * 1000;

                localStorage.setItem('arinaLoginSession', JSON.stringify({
                    loggedIn: true,
                    userId: user.id,
                    phone: p,
                    expiresAt
                }));

                // Show the same lower-UI 18+ popup.
                ageModal.classList.add('show');
            }

            // =======================================
            // AGE POPUP
            // Both buttons continue, as requested.
            // =======================================

            function finishJoin(answer) {
                localStorage.setItem('arinaAge18', answer);

                // Login session remains active for 15 days.
                ageModal.classList.remove('show');
                location.replace(SITE_URL);
            }

            // =======================================
            // LOWER UI FORM SUBMIT
            // =======================================

            joinForm.addEventListener('submit', function(e) {
                e.preventDefault();
                loginUser();
            });

            // =======================================
            // PAKISTAN PHONE DISPLAY FORMAT
            // =======================================

            phoneInput.addEventListener('input', function() {
                let digits = cleanPhone(this.value).slice(0, 10);

                // Pakistan mobile format after +92: 300 1234567
                if (digits.length <= 3) {
                    this.value = digits;
                    return;
                }

                this.value = digits.slice(0, 3) + ' ' + digits.slice(3);
            });

            // =======================================
            // START
            // =======================================

            checkExistingLogin();
        </script>
    </body>
</html>
